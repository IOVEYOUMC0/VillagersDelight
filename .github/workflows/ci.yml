name: CI

# VillagersDelight is a multi-module build: core/launcher run on Gradle 8.14.2 with a Java 21 toolchain, the
# NMS layers on Gradle 9.0/9.1 (nms-26 asks for a Java 25 toolchain), and each module carries its own wrapper.
# Every module is therefore built with its own wrapper, after the modules it consumes, because launcher merges
# their build/libs jars into the shaded plugin jar.
#
# `gradle test` runs no tests in this repository: verification is the four JavaExec `check*` tasks, invoked
# explicitly below.

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VillagersDelight
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # setup-java exports JAVA_HOME_21_X64 / JAVA_HOME_25_X64; Gradle only discovers toolchains in its known
      # locations, so both are named explicitly and the per-module toolchain request resolves.
      - name: Toolchains available to Gradle
        run: |
          echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME_21_X64},${JAVA_HOME_25_X64}" >> "$GITHUB_ENV"

      - name: Core (record checks)
        working-directory: core
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build
          ./gradlew --no-daemon checkFoodRules checkCraftMirror checkBehaviorWithdraw checkServerCompatibility

      - name: NMS 1.21.5 layer
        working-directory: nms-1.21.5
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build

      - name: NMS 1.21.11 layer
        working-directory: nms-1211
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build

      - name: NMS 26.x layer
        working-directory: nms-26
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build

      - name: Launcher (shaded plugin jar)
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build

      - name: Upload shaded jar
        uses: actions/upload-artifact@v4
        with:
          name: VillagersDelight-jar
          path: launcher/build/libs/villagersdelight-*.jar
          if-no-files-found: error
