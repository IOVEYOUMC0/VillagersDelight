# Paper plugin manifest. Replaces plugin.yml: a Paper plugin gets its own class loader, so a
# bundled library cannot be silently shared with (or overridden by) another plugin's copy, and
# dependency order is declared per dependency instead of guessed from depend/softdepend.
#
# join-classpath is true wherever this plugin resolves the dependency's classes itself
# (Class.forName, direct imports, or a bundled bridge that does so on its behalf).
# load: POSTWORLD is deliberate (the Paper default): onEnable touches worlds.

name: VillagersDelight
version: '0.1.1'
main: com.huidu.villagersdelight.core.VillagersDelightPlugin
api-version: '1.21.4'
folia-supported: true
description: Villager farming compatibility for CraftEngine crops.
authors:
  - HuiDu_OwO

# The /villagersdelight command (and /vd alias) is registered through Paper's lifecycle API in onEnable.
dependencies:
  server:
    CraftEngine:
      load: BEFORE
      required: true
      join-classpath: true
    CustomCrops:
      load: BEFORE
      required: false
      join-classpath: true
    FarmersDelight:
      load: BEFORE
      required: false
      join-classpath: false

permissions:
  villagersdelight.reload:
    description: Reload VillagersDelight configuration
    default: op
  villagersdelight.inventory:
    description: Open and edit a villager's backpack
    default: op
